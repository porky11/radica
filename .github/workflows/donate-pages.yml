name: Donate page

on:
  push:
    branches: [master]
    paths: ["donate-app/**", ".github/workflows/donate-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix donate-app
      - run: npm --prefix donate-app test
      - run: npm --prefix donate-app run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: donate-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4

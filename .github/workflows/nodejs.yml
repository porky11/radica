name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci --prefix ui
      - run: npm run build:ui
      - name: UI smoke tests (Playwright)
        working-directory: ui
        run: npx playwright install --with-deps chromium && npx playwright test
      - run: npm run build:contract
      - run: npm test
      - run: npm ci --prefix donation-contract
      - run: npm --prefix donation-contract test
      - run: npm ci --prefix donate-app
      - run: npm --prefix donate-app test
      - run: npm --prefix donate-app run build
      - run: npm ci --prefix attester
      - run: npm --prefix attester test

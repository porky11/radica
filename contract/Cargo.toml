[package]
name = "radica-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.8", features = ["contract"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"
whoiam-delegation = { git = "https://github.com/scobru/freenames", rev = "d6dc35f8d0d85c0d95430c5da3c3eeb8e9ee9120" } # Viso: app keys a persona delegated
blake3 = { version = "1", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dev-dependencies]
rand = "0.8"
